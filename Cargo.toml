[workspace]
resolver = "3"
members = ["crates/*", "plugins/permissions"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
space-protocol = { path = "crates/space-protocol" }
space-core = { path = "crates/space-core" }
space-ui = { path = "crates/space-ui" }
space-plugin = { path = "crates/space-plugin" }
agent-client-protocol = "5.0.0"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
schemars = "1"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
tempfile = "3"
