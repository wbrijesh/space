[package]
name = "space-app"
description = "Space desktop app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Capitalized: macOS names an unbundled app after its executable (menu bar, Dock).
name = "Space"
path = "src/main.rs"

[features]
# Dev tooling: component gallery (⌥⌘G, --gallery), scenarios (--scenario), animation-clock
# controls, input scripts. On by default; ship with `--no-default-features` (`just release`).
default = ["dev"]
dev = ["space-ui/dev", "dep:schemars", "dep:notify"]
# Live Rust edits under `dx serve --hot-patch` (`just run`): turns on gpui-pre's `hot-reload`,
# which gpui-kit doesn't forward. GPUI also requires a debug build, so it can't reach a release.
hot = ["dep:gpui-hot-reload"]

[dependencies]
space-core.workspace = true
space-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
# `just run`: watch plugin sources to rebuild and restart them (src/reload.rs).
notify = { version = "8", optional = true }
space-protocol.workspace = true
space-terminal.workspace = true
anyhow.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# GPUI via gpui-kit 0.9.0: re-exports gpui-pre 0.3.11 (crates.io snapshot of Zed's GPUI),
# its macOS platform, and gpui-component. Renamed to `gpui` so GPUI macro output resolves.
gpui = { package = "gpui-kit", version = "0.9.0" }
# The same gpui-pre gpui-kit pins, named again only to switch on `hot-reload` (feature `hot`).
gpui-hot-reload = { package = "gpui-pre", version = "=0.3.11", features = ["hot-reload"], optional = true }
# macOS: "agent finished" notifications, sounds, Dock icon (src/notify.rs). Same versions GPUI uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSImage", "NSSound", "NSResponder"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3", features = ["CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
sha2 = "0.10"
objc2-user-notifications = { version = "0.3", features = [
    "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest",
    "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger",
] }

[dev-dependencies]
tempfile.workspace = true
