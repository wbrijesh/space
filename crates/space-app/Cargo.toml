[package]
name = "space-app"
description = "Space desktop app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Capitalized: macOS names an unbundled app after its executable (menu bar, Dock).
name = "Space"
path = "src/main.rs"

[features]
# Dev tooling: component gallery (⌥⌘G, --gallery), scenarios (--scenario), animation-clock
# controls, input scripts. On by default; ship with `--no-default-features` (`just release`).
default = ["dev"]
dev = ["space-ui/dev", "dep:serde", "dep:serde_json", "dep:schemars"]

[dependencies]
space-core.workspace = true
space-ui.workspace = true
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
space-protocol.workspace = true
anyhow.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# GPUI via gpui-kit 0.9.0: re-exports gpui-pre 0.3.11 (crates.io snapshot of Zed's GPUI),
# its macOS platform, and gpui-component. Renamed to `gpui` so GPUI macro output resolves.
gpui = { package = "gpui-kit", version = "0.9.0" }
# macOS: "agent finished" notifications, sounds, Dock icon (src/notify.rs). Same versions GPUI uses.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData", "NSError", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSSound", "NSResponder"] }
objc2-user-notifications = { version = "0.3", features = [
    "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest",
    "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger",
] }
