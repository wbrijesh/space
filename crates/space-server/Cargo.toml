[package]
name = "space-server"
description = "The Space server: the host, its agents and threads, kept running while the app comes and goes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
space-core.workspace = true
space-plugin.workspace = true
space-keeper.workspace = true
space-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "space-server"
path = "src/main.rs"
