[package]
name = "space-server"
description = "The Space server: the host, its agents and threads, kept running while the app comes and goes"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
space-core.workspace = true
space-plugin.workspace = true
space-keeper.workspace = true
space-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal"] }
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSTimer", "NSDate", "NSRunLoop", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSAlert", "NSImage", "objc2-core-foundation"] }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "space-server"
path = "src/main.rs"
