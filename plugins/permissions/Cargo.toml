[package]
name = "space-permissions"
description = "Space permissions plugin: Read Only (macOS sandbox), Workspace Write and Full access (decision-model guardrail)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "space-permissions"
path = "src/main.rs"

[dependencies]
space-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Direct HTTPS to the OpenAI Decisions API: rustls on ring (no aws-lc), the system's roots.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
space-core.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
